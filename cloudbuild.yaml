options:
  machineType: E2_HIGHCPU_8

steps:
  - name: node:22
    entrypoint: bash
    args: ['-c', 'cp /usr/local/bin/node /toolchain/node && bash verify-release.sh node']
    volumes:
      - name: node-toolchain
        path: /toolchain
  - name: mcr.microsoft.com/dotnet/sdk:10.0
    entrypoint: bash
    args: ['-c', 'PATH=/toolchain:$$PATH bash verify-release.sh dotnet']
    volumes:
      - name: node-toolchain
        path: /toolchain
    env: [PULSARTMS_RELEASE_DIR=/workspace/artifacts/release]
  - name: node:22
    entrypoint: bash
    args: [verify-release.sh, artifact]
    env: [PULSARTMS_RELEASE_DIR=/workspace/artifacts/release]
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Server/API/Dockerfile
      - -t
      - us-east4-docker.pkg.dev/amftms/amftms/api:$BUILD_ID
      - .

images:
  - us-east4-docker.pkg.dev/amftms/amftms/api:$BUILD_ID
